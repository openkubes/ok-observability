apiVersion: v1
kind: ConfigMap
metadata:
  name: ok-observability-dashboard-platform-overview
  labels:
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "id": null,
      "uid": "ok-obs-platform-overview",
      "title": "Platform Overview",
      "description": "Minimal starting dashboard for the ok-observability standard profile — node CPU usage and pod restart activity, sourced from the in-cluster Prometheus datasource.",
      "schemaVersion": 39,
      "version": 1,
      "tags": ["ok-observability", "platform"],
      "timezone": "utc",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "title": "Node CPU Usage (%)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod Restarts (last 10m)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total[10m])",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }

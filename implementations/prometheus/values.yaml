# Reference values for the Metrics + Alerting contract guarantees
# (ADR-Platform-018 #1, #4). Defaults here are for local/dev evaluation.
#
# Provider Values (per-cluster; do NOT edit in place — override at install
# time with `-f <provider-values.yaml>`, see contracts/observability-capability-contract-v1.md
# and profiles/ok-observability-standard/):
#   - storageClassName (Prometheus + Alertmanager)
#   - retention
#   - resources
#   - alert receiver (see alerting/alertmanager-values.yaml — layered separately)

kube-prometheus-stack:
  fullnameOverride: ok-observability

  # Guarantee #2 (Dashboards) is served by implementations/grafana as its own
  # release, wired to this Prometheus via its Service. Keep disabled here to
  # avoid a second, unconfigured Grafana instance.
  grafana:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 15d # Provider Value
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value — ok-storage contract
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # Discover ServiceMonitors/PodMonitors/PrometheusRules cluster-wide,
      # not just ones carrying this release's Helm label — required for
      # guarantee #1 ("workloads can declaratively register") and to pick
      # up alerting/prometheus-rules.yaml regardless of its release label.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Fix for a real failure found running against ok-shared (local-path
      # storage class): "local-path-provisioner" backs its PVs with a plain
      # hostPath volume, and kubelet does NOT apply automatic fsGroup
      # ownership changes for hostPath volumes (unlike most other volume
      # plugins) — Prometheus then panics on startup with
      # "open /prometheus/queries.active: permission denied", even though
      # runAsUser/runAsGroup/fsGroup are all set correctly. The
      # OpenSearch chart already ships an equivalent init container for the
      # same reason (see implementations/opensearch) — kube-prometheus-stack
      # does not, so we add one here.
      #
      # UNVERIFIED volume name: derived from the observed PVC name
      # (prometheus-ok-observability-prometheus-db-prometheus-ok-observability-prometheus-0)
      # via the StatefulSet claim-template naming convention
      # (<claimTemplateName>-<podName>). Confirm with:
      #   kubectl get pod prometheus-ok-observability-prometheus-0 \
      #     -o jsonpath='{.spec.volumes[*].name}'
      # and correct the mountPath's `name:` below if it differs (e.g. after
      # a kube-prometheus-stack/Prometheus Operator version bump).
      initContainers:
        - name: fix-local-path-fsgroup
          image: busybox:1.36
          # Self-diagnosing: prints ownership before/after so a stuck
          # permission-denied issue is visible in `kubectl logs -c
          # fix-local-path-fsgroup` without needing to exec into a
          # crash-looping main container (which usually isn't possible —
          # it isn't in a Running state long enough to attach to).
          command:
            - sh
            - -c
            - |
              echo "BEFORE (id, and /prometheus ownership):"
              id
              ls -ld /prometheus
              ls -la /prometheus | head -20
              chown -R 1000:2000 /prometheus
              chmod -R u+rwX,g+rwX /prometheus
              echo "AFTER:"
              ls -ld /prometheus
              ls -la /prometheus | head -20
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: prometheus-ok-observability-prometheus-db
              mountPath: /prometheus

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value
            resources:
              requests:
                storage: 2Gi
    # Routing/receivers intentionally NOT set here — see
    # alerting/alertmanager-values.yaml, layered in at install time so that
    # alert-receiver Provider Values stay physically separate from metrics
    # values (matches the alerting/ vs implementations/prometheus/ split in
    # the repo layout).

  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

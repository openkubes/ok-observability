# Reference values for the Metrics + Alerting contract guarantees
# (ADR-Platform-018 #1, #4). Defaults here are for local/dev evaluation.
#
# Provider Values (per-cluster; do NOT edit in place — override at install
# time with `-f <provider-values.yaml>`, see contracts/observability-capability-contract-v1.md
# and profiles/ok-observability-standard/):
#   - storageClassName (Prometheus + Alertmanager)
#   - retention
#   - resources
#   - alert receiver (see alerting/alertmanager-values.yaml — layered separately)

kube-prometheus-stack:
  fullnameOverride: ok-observability

  # Guarantee #2 (Dashboards) is served by implementations/grafana as its own
  # release, wired to this Prometheus via its Service. Keep disabled here to
  # avoid a second, unconfigured Grafana instance.
  grafana:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 15d # Provider Value
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value — ok-storage contract
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # Discover ServiceMonitors/PodMonitors/PrometheusRules cluster-wide,
      # not just ones carrying this release's Helm label — required for
      # guarantee #1 ("workloads can declaratively register") and to pick
      # up alerting/prometheus-rules.yaml regardless of its release label.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Fix for a real failure found running against ok-shared: Prometheus
      # panicked with "open /prometheus/queries.active: permission denied"
      # even though the PVC root was already correctly owned 1000:2000,
      # world-writable (confirmed via this init container's own diagnostic
      # output before assuming a fix was even needed — see git history for
      # the disproven "local-path doesn't support fsGroup" theory this
      # replaced). Real cause: the "prometheus" container mounts the volume
      # with `subPath: prometheus-db` (visible via
      # `kubectl get pod ... -o json | jq '.spec.containers[] |
      # select(.name=="prometheus") | .volumeMounts'`) — Kubernetes
      # auto-creates a missing subPath directory at pod start, but does NOT
      # apply fsGroup-based ownership to that auto-created directory (a
      # known Kubernetes subPath behavior, distinct from and easy to
      # confuse with the storage-class-level fsGroup question). The fix
      # must create/chown the exact subPath, not just the PVC root.
      #
      # UNVERIFIED volume name / subPath: derived from the observed PVC
      # name and a live `kubectl get pod ... -o json` inspection on
      # 2026-07-24 against kube-prometheus-stack as pinned in Chart.yaml.
      # Re-verify both (`.spec.volumes[*].name` and the "prometheus"
      # container's volumeMounts subPath) after any chart version bump.
      initContainers:
        - name: fix-local-path-fsgroup
          image: busybox:1.36
          # Self-diagnosing: prints ownership before/after so a stuck
          # permission-denied issue is visible in `kubectl logs -c
          # fix-local-path-fsgroup` without needing to exec into a
          # crash-looping main container (which usually isn't possible —
          # it isn't in a Running state long enough to attach to).
          command:
            - sh
            - -c
            - |
              echo "BEFORE (id, and /prometheus/prometheus-db ownership):"
              id
              ls -ld /prometheus
              mkdir -p /prometheus/prometheus-db
              ls -la /prometheus/prometheus-db | head -20
              chown -R 1000:2000 /prometheus/prometheus-db
              chmod -R u+rwX,g+rwX /prometheus/prometheus-db
              echo "AFTER:"
              ls -ld /prometheus/prometheus-db
              ls -la /prometheus/prometheus-db | head -20
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: prometheus-ok-observability-prometheus-db
              mountPath: /prometheus

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value
            resources:
              requests:
                storage: 2Gi
    # Routing/receivers intentionally NOT set here — see
    # alerting/alertmanager-values.yaml, layered in at install time so that
    # alert-receiver Provider Values stay physically separate from metrics
    # values (matches the alerting/ vs implementations/prometheus/ split in
    # the repo layout).

  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

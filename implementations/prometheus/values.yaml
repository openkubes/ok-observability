# Reference values for the Metrics + Alerting contract guarantees
# (ADR-Platform-018 #1, #4). Defaults here are for local/dev evaluation.
#
# Provider Values (per-cluster; do NOT edit in place — override at install
# time with `-f <provider-values.yaml>`, see contracts/observability-capability-contract-v1.md
# and profiles/ok-observability-standard/):
#   - storageClassName (Prometheus + Alertmanager)
#   - retention
#   - resources
#   - alert receiver (see alerting/alertmanager-values.yaml — layered separately)

kube-prometheus-stack:
  fullnameOverride: ok-observability

  # Guarantee #2 (Dashboards) is served by implementations/grafana as its own
  # release, wired to this Prometheus via its Service. Keep disabled here to
  # avoid a second, unconfigured Grafana instance.
  grafana:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 15d # Provider Value
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value — ok-storage contract
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # Discover ServiceMonitors/PodMonitors/PrometheusRules cluster-wide,
      # not just ones carrying this release's Helm label — required for
      # guarantee #1 ("workloads can declaratively register") and to pick
      # up alerting/prometheus-rules.yaml regardless of its release label.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Fix for a real failure found running against ok-shared: Prometheus
      # panicked with "open /prometheus/queries.active: permission denied".
      # Root cause, confirmed through a three-step live investigation (see
      # git history: 270d54a, a8d4494, 075d3dd for the two disproven
      # hypotheses and the diagnostics that ruled them out):
      #   1. NOT "local-path-provisioner doesn't support fsGroup" — the PVC
      #      root was already correctly owned 1000:2000 before any fix ran.
      #   2. NOT plain subPath-directory-ownership either, in isolation —
      #      a write test as the exact same UID/GID succeeded once ownership
      #      was fixed... but only when NOT combined with
      #      readOnlyRootFilesystem.
      #   3. THE actual cause: the operator-generated "prometheus" container
      #      sets `readOnlyRootFilesystem: true` AND mounts the data volume
      #      via `subPath: prometheus-db`. That specific combination made
      #      the subPath mount behave as read-only on this cluster's
      #      container runtime, confirmed by reproducing the identical
      #      "permission denied" with a throwaway container replicating
      #      both settings exactly.
      # Fix has two parts:
      #   a) chown the subPath directory (Kubernetes auto-creates a missing
      #      subPath dir but doesn't apply fsGroup ownership to it — still
      #      necessary on its own, independent of the readOnlyRootFilesystem
      #      finding)
      #   b) override the "prometheus" container's readOnlyRootFilesystem
      #      to false via prometheusSpec.containers (Prometheus Operator's
      #      supported mechanism for patching operator-generated containers
      #      by name)
      #
      # UNVERIFIED volume name / subPath: derived from a live `kubectl get
      # pod ... -o json` inspection on 2026-07-24 against kube-prometheus-stack
      # as pinned in Chart.yaml. Re-verify after any chart version bump —
      # see implementations/prometheus/README.md.
      initContainers:
        - name: fix-local-path-fsgroup
          image: busybox:1.36
          # Self-diagnosing: prints ownership before/after so a stuck
          # permission-denied issue is visible in `kubectl logs -c
          # fix-local-path-fsgroup` without needing to exec into a
          # crash-looping main container (which usually isn't possible —
          # it isn't in a Running state long enough to attach to).
          command:
            - sh
            - -c
            - |
              echo "BEFORE (id, and /prometheus/prometheus-db ownership):"
              id
              ls -ld /prometheus
              mkdir -p /prometheus/prometheus-db
              ls -la /prometheus/prometheus-db | head -20
              chown -R 1000:2000 /prometheus/prometheus-db
              chmod -R u+rwX,g+rwX /prometheus/prometheus-db
              echo "AFTER:"
              ls -ld /prometheus/prometheus-db
              ls -la /prometheus/prometheus-db | head -20
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: prometheus-ok-observability-prometheus-db
              mountPath: /prometheus

      # Part (b) of the fix above: the operator generates a "prometheus"
      # container with readOnlyRootFilesystem: true; this patches just that
      # one field by container name, per Prometheus Operator's documented
      # mechanism for overriding generated containers.
      containers:
        - name: prometheus
          securityContext:
            readOnlyRootFilesystem: false

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: "" # Provider Value
            resources:
              requests:
                storage: 2Gi
    # Routing/receivers intentionally NOT set here — see
    # alerting/alertmanager-values.yaml, layered in at install time so that
    # alert-receiver Provider Values stay physically separate from metrics
    # values (matches the alerting/ vs implementations/prometheus/ split in
    # the repo layout).

  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

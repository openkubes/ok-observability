# Datacenter-envelope Secret profile — VSO sync of ok-observability-credentials
# (OK-109 Part 2 / OK-110 / ADR-Platform-025). Proven on ok-robotics 2026-07-26.
#
# Replaces the offline file-based `ok-observability-credentials` Secret (created by
# ok-cluster `make install-observability`) with a Vault-sourced sync — NO chart
# change (Grafana admin.existingSecret / OpenSearch secretKeyRef / Fluent Bit
# ${OPENSEARCH_PASSWORD} still read the same named Secret + keys).
#
# Prerequisites (per consuming cluster):
#   - Central Vault on ok-shared, KV v2 at `secret/`, with the credentials at
#       secret/ok-robotics/obs/observability-credentials
#     keys: grafana-admin-user, grafana-admin-password, opensearch-admin-password
#   - Vault auth mount + workload-scoped role/policy for this cluster, provisioned
#     by the ok-cluster VaultConfig XR (provider-vault reconciler): mount
#     `kubernetes/<cluster>`, role bound to SA `<obs-namespace>/sa-obs`, policy
#     read on `secret/data/<cluster>/obs/*`.
#   - SA `sa-obs` in the observability namespace (auth identity for VSO).
#   - Secret `vault-ca` (key `ca.crt`) in the observability namespace = the
#     ok-shared internal CA (cert-manager), so VSO trusts the Vault endpoint.
#   - VSO installed:
#       helm repo add hashicorp https://helm.releases.hashicorp.com
#       helm install vault-secrets-operator hashicorp/vault-secrets-operator \
#         -n vault-secrets-operator --create-namespace
#
# Per-cluster values to adjust: namespace, VaultConnection.address (node IP),
# VaultAuth.mount (kubernetes/<cluster>), VaultStaticSecret.path.
#
# NOTE (interim reachability): address uses the Traefik NodePort 30443 on an
# ok-shared node IP + SNI, because child clusters run no MetalLB. The canonical
# fix is a host-level LoadBalancer on ok-infra (ok-mgmt-lb pattern) → then
# address becomes https://vault.ok-shared.internal:443. See OK-110.
# ---------------------------------------------------------------------------
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: ok-shared-vault
  namespace: ok-observability
spec:
  # Interim NodePort path (no MetalLB on child clusters); SNI still validates the cert.
  address: https://10.44.0.38:30443
  tlsServerName: vault.ok-shared.internal
  caCertSecretRef: vault-ca            # Secret with key ca.crt = ok-shared internal CA
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ok-robotics
  namespace: ok-observability
spec:
  vaultConnectionRef: ok-shared-vault
  method: kubernetes
  mount: kubernetes/ok-robotics        # per-cluster auth mount (VaultConfig XR)
  kubernetes:
    role: sa-obs
    serviceAccount: sa-obs             # bound in the Vault role
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ok-observability-credentials
  namespace: ok-observability
spec:
  vaultAuthRef: ok-robotics
  mount: secret                        # KV v2 mount
  type: kv-v2
  path: ok-robotics/obs/observability-credentials
  refreshAfter: 60s
  destination:
    name: ok-observability-credentials # exact name the charts consume — no chart change
    create: true
    overwrite: true                    # take over the pre-existing file-based Secret

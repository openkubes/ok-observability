# Datacenter-envelope Secret profile — VSO sync of the observability credentials
# Secret, as a per-cluster TEMPLATE (ADR-Platform-025 §Implementation & placement).
#
# This is the parameterised form of vault-secret-sync.ok-robotics.yaml, which stays
# as the worked example. ok-cluster renders and applies this — ok-cluster INSTALLS
# the capability, it does not own the asset, so the manifest lives here.
#
# RENDERING — substitute ONLY the named variables:
#
#   envsubst '$CLUSTER $OBS_NAMESPACE $SECRET_NAME $VAULT_ADDR $VAULT_TLS_SERVER_NAME
#             $VAULT_CA_SECRET $KV_MOUNT $KV_PATH $VSO_SERVICE_ACCOUNT $REFRESH_AFTER' \
#     < vault-secret-sync.template.yaml | kubectl apply -f -
#
# Pass the explicit variable list. A bare `envsubst` substitutes EVERY ${VAR} it
# finds, which would silently blank the chart-side placeholders documented in this
# repo (Fluent Bit's OPENSEARCH_PASSWORD env expansion, for one). The list form is
# not a style preference — it is what keeps unrelated placeholders intact.
#
# Variables, and where each comes from:
#
#   CLUSTER              the ADR-013 cluster id. Selects the Vault auth mount and
#                        the KV path prefix — provisioned by the VaultConfig XR.
#   OBS_NAMESPACE        observability namespace (default ok-observability). Note
#                        the SA and CA Secret must exist in THIS namespace.
#   SECRET_NAME          the Secret the charts consume by name. Must stay exactly
#                        ok-observability-credentials — no chart change (ADR-025).
#   VAULT_ADDR           stable host-level LoadBalancer for ok-shared ingress
#                        (OK-110 Path A), e.g. https://192.168.100.207:443. Not a
#                        VM node IP.
#   VAULT_TLS_SERVER_NAME  SNI presented so the cert validates, e.g.
#                        vault.ok-shared.internal.
#   VAULT_CA_SECRET      Secret in OBS_NAMESPACE holding key ca.crt = the ok-shared
#                        internal CA (cert-manager), so VSO trusts the endpoint.
#   KV_MOUNT             KV v2 mount, normally `secret`.
#   KV_PATH              path within the mount, normally
#                        <cluster>/obs/observability-credentials.
#   VSO_SERVICE_ACCOUNT  SA in OBS_NAMESPACE that VSO authenticates as; must be the
#                        SA bound in the Vault role (normally sa-obs).
#   REFRESH_AFTER        periodic reconciliation interval. ADR-025 requires this to
#                        be set unconditionally — Enterprise event notifications are
#                        an optional latency optimisation, never a conformance
#                        dependency.
#
# Prerequisites per consuming cluster (all provisioned outside this manifest):
#   - credentials present in Vault at ${KV_MOUNT}/${KV_PATH} with keys
#     grafana-admin-user, grafana-admin-password, opensearch-admin-password
#   - Vault auth mount kubernetes/<cluster> + workload-scoped role/policy, from the
#     ok-cluster VaultConfig XR (provider-vault reconciler)
#   - the ServiceAccount and the CA Secret, in OBS_NAMESPACE
#   - VSO installed on the consuming cluster, pinned (ok-cluster `make install-vso`)
#
# ORDERING IS THE POINT: this must be applied and reach SYNCED *before* the
# observability Helm release, because OpenSearch 2.12+ refuses to start without the
# admin password at first boot. Applying it afterwards proves migration, not
# fresh-install ordering — that distinction is ADR-025 criterion 6 vs criterion 7.
# ---------------------------------------------------------------------------
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: ok-shared-vault
  namespace: ${OBS_NAMESPACE}
spec:
  address: ${VAULT_ADDR}
  tlsServerName: ${VAULT_TLS_SERVER_NAME}
  caCertSecretRef: ${VAULT_CA_SECRET}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ${CLUSTER}
  namespace: ${OBS_NAMESPACE}
spec:
  vaultConnectionRef: ok-shared-vault
  method: kubernetes
  mount: kubernetes/${CLUSTER}
  kubernetes:
    role: ${VSO_SERVICE_ACCOUNT}
    serviceAccount: ${VSO_SERVICE_ACCOUNT}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ${SECRET_NAME}
  namespace: ${OBS_NAMESPACE}
spec:
  vaultAuthRef: ${CLUSTER}
  mount: ${KV_MOUNT}
  type: kv-v2
  path: ${KV_PATH}
  refreshAfter: ${REFRESH_AFTER}
  destination:
    name: ${SECRET_NAME}
    create: true
    # overwrite lets VSO adopt a pre-existing file-based Secret of the same name.
    # Harmless on a fresh install where no such Secret exists; required for the
    # migration case (ADR-025 criterion 6).
    overwrite: true

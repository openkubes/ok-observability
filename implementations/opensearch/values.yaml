# Reference values for the Logs contract guarantee (ADR-Platform-018 #3).
#
# v1 default logging policy: all container logs; exclusions and retention
# are Provider Values (contract v1, "Logs" guarantee).

opensearch:
  # NOTE: fullnameOverride does NOT control this chart's Service name — the
  # opensearch-project/helm-charts chart names its Service from
  # `clusterName` + node role, not the standard Helm fullname convention.
  # Found running against a live cluster: the real Service is
  # `opensearch-cluster-master` (+ `-headless`) regardless of this setting.
  # fullnameOverride is kept for other resources (StatefulSet, etc.) but do
  # NOT assume it controls the Service name — see fluent-bit.config.outputs
  # below, which points at the confirmed real name.
  fullnameOverride: ok-observability-opensearch

  # Single-node-capable for v1; HA is an explicit follow-up (not required by
  # the contract — guarantee #5 Autonomy only requires no cross-cluster
  # dependency, not multi-node HA within a cluster).
  replicas: 1
  singleNode: true

  persistence:
    enabled: true
    storageClass: "" # Provider Value — ok-storage contract
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

  # REQUIRED Provider Value (not optional, unlike Grafana's adminPassword):
  # OpenSearch 2.12+ refuses to start at all without this set — the
  # container exits immediately ("No custom admin password found").
  # Found running the empty default against a live cluster (OK-79).
  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: "" # MUST be overridden at install time; empty = container will not start

  # Index lifecycle / retention: no default ILM policy is shipped in v1.
  # Applying one is a Provider Value follow-up (index_state_management via
  # OpenSearch's ISM plugin, or an external curator CronJob) — tracked as a
  # known gap, not a silent omission.

fluent-bit:
  fullnameOverride: ok-observability-log-collector

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  config:
    outputs: |
      [OUTPUT]
          Name            opensearch
          Match           *
          Host            opensearch-cluster-master
          Port            9200
          Index           ok-observability-logs
          Suppress_Type_Name On
          # OpenSearch's Security Plugin is enabled by default (see
          # implementations/opensearch's REQUIRED admin-password Provider
          # Value above) — it serves HTTPS with a self-signed demo
          # certificate and requires Basic Auth, even for the Bulk API
          # fluent-bit uses. Found running against a live cluster: without
          # `tls`/`tls.verify`/HTTP_User/HTTP_Passwd, fluent-bit fails with
          # "broken connection ... HTTP status=0" (a plaintext HTTP
          # request hitting a TLS port, not a DNS or routing problem).
          tls             On
          tls.verify      Off
          HTTP_User       admin
          HTTP_Passwd     "" # REQUIRED Provider Value — MUST match opensearch.extraEnvs[].OPENSEARCH_INITIAL_ADMIN_PASSWORD above
    # Default logging policy (contract guarantee #3): all container logs.
    # Exclusions are a Provider Value — add a [FILTER] grep/exclude block
    # here per cluster (e.g. to drop noisy system namespaces).
